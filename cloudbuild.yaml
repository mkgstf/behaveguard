# CI/CD pipeline for BehaveGuard, triggered on push to `main`.
#
# Runs in order: build image -> push it -> run migrations against Supabase
# -> deploy API service -> update retrain Job -> smoke test.

steps:
  # 1. Build the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:$SHORT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:latest'
      - -f
      - Dockerfile
      - .

  # 2. Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api'
      - --all-tags
    waitFor: [build]

  # 3. Run migrations directly against Supabase using the built image.
  - id: migrate
    name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:$SHORT_SHA'
    entrypoint: sh
    args:
      - -c
      - |
        alembic upgrade head
    secretEnv: ['DATABASE_URL']
    waitFor: [push]

  # 4. Deploy the API service.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_API_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--update-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--clear-vpc-connector'
    waitFor: [migrate]

  # 5. Update the retrain Cloud Run Job.
  - id: update-retrain-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - '${_RETRAIN_JOB}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--update-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--clear-vpc-connector'
    waitFor: [migrate]

  # 6. Smoke test.
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        URL=$(gcloud run services describe ${_API_SERVICE} --region=${_REGION} --format='value(status.url)')
        curl -f "$$URL/api/v1/ping"
        curl -f "$$URL/api/v1/health"
    waitFor: [deploy-api]

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest'
      env: 'DATABASE_URL'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/behaveguard/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
