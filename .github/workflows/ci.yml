name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Ephemeral, job-scoped services — created fresh and destroyed when the
    # job finishes. There's no path from here to any persistent/real
    # database; the explicit "_test" database name below is defense in
    # depth on top of that, satisfying the safety check in
    # tests/conftest.py (which refuses to run — and would TRUNCATE
    # everything — against anything that doesn't look like a dedicated
    # test database).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: behaveguard
          POSTGRES_PASSWORD: behaveguard
          POSTGRES_DB: behaveguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U behaveguard -d behaveguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://behaveguard:behaveguard@localhost:5432/behaveguard_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: behaveguard-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: behaveguard-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
