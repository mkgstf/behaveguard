[project]
name = "behaveguard"
version = "0.1.0"
description = "Behavioral authentication training and verification backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "numpy>=2.2",
  "scikit-learn>=1.7",
  "joblib>=1.5",
  "pandas>=2.3",
  "openpyxl>=3.1",
  "torch>=2.7",
  "typer>=0.16",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pgvector>=0.2",
  "redis>=5.0",
  "bcrypt>=4.1",
  "pyjwt>=2.9",
  "google-auth>=2.35",
  "requests>=2.32",
  "httpx>=0.28",
  "email-validator>=2.2",
  "python-dotenv>=1.0",
  "google-cloud-run>=0.10",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-cov>=6.2"]

[project.scripts]
behaveguard = "behaveguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behaveguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# --- CPU-only PyTorch Source ---
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
